name: quota-probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6]
    steps:
      - name: burn
        run: |
          echo "shard ${{ matrix.shard }} start $(date -u +%FT%TZ)"
          sleep 21000
          echo "shard ${{ matrix.shard }} end $(date -u +%FT%TZ)"
